[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "db-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.116.0",
    "aiosqlite>=0.20.0",
    "chromadb>=1.5.9",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "matplotlib>=3.11.1",
    "mcp>=1.28.1",
    "numpy>=2.5.1",
    "openai>=2.46.0",
    "python-dotenv>=1.2.2",
    "fpdf2>=2.8.7",
    "streamlit>=1.61.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.2.1",
    "opik>=1.7.0",
    "redis>=7.4.1",
    "langgraph-checkpoint-redis>=0.5.2",
    "pymilvus>=3.0.1",
    "milvus-lite>=3.2.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

# ── CLI 入口：安装后可直接用 `db-agent` 命令 ──
[project.scripts]
db-agent = "main:cli_main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["harness*", "server*", "db*"]

# ── 代码质量门禁 ──
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["frontend", ".venv", "archive", "sidecar"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # 行长不作为硬性错误（项目已有中文注释长行风格）

# 入口/脚本/测试里有意的惰性导入（先 load_dotenv / 避免循环导入）
[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"app.py" = ["E402"]
"server/main.py" = ["E402"]
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
