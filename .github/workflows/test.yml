name: test

# 所有分支的 push / PR 都跑：开发分支（chore/*、feat/*）也要被 CI 守住，
# 否则红测试只会在 merge 到 master 时才暴露。
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

      - name: Eval guardrails (zero API)
        run: uv run python tests/eval_runner.py --fast
