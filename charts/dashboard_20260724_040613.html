<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>华东 vs 华南 销售趋势分析大屏</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "PingFang SC","Microsoft YaHei",sans-serif;
  background: linear-gradient(135deg, #0a0e1a 0%, #101830 50%, #0d1124 100%);
  color: #e0e6f0; min-height:100vh; overflow-x:hidden;
}
.header { text-align:center; padding:24px 0 8px; }
.header h1 {
  font-size:28px; font-weight:600; letter-spacing:4px;
  background: linear-gradient(90deg, #5470c6, #91cc75, #fac858);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.header .sub { font-size:13px; color:#556; margin-top:6px; letter-spacing:2px; }
.header::after {
  content:''; display:block; width:60%; height:1px;
  background: linear-gradient(90deg, transparent, #334, transparent); margin:16px auto 0;
}
.kpi-row { display:flex; justify-content:center; gap:16px; padding:12px 24px; flex-wrap:wrap; }
.kpi-card {
  background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
  border-radius:8px; padding:12px 24px; text-align:center; min-width:100px;
}
.kpi-value { display:block; font-size:22px; font-weight:700; color:#91cc75; }
.kpi-label { display:block; font-size:11px; color:#667; margin-top:4px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:12px 24px 24px; max-width:1400px; margin:0 auto; }
.panel {
  background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06);
  border-radius:10px; padding:12px; min-height:300px; transition: border-color 0.3s;
}
.panel:hover { border-color: rgba(84,112,198,0.4); }
.chart { width:100%; height:320px; }
.footer { text-align:center; padding:8px; color:#334; font-size:11px; letter-spacing:2px; }
@media (max-width:900px) { .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="header">
  <h1>华东 vs 华南 销售趋势分析大屏</h1>
  <div class="sub">REAL-TIME ANALYTICS DASHBOARD</div>
</div>
<div class="kpi-row"><div class="kpi-card"><span class="kpi-value">235,131</span><span class="kpi-label">📈 华东 &(均值)</span></div><div class="kpi-card"><span class="kpi-value">274,662</span><span class="kpi-label">📈 华南 月(均值)</span></div><div class="kpi-card"><span class="kpi-value">6,627,300</span><span class="kpi-label">📊 两地区总</span></div><div class="kpi-card"><span class="kpi-value">6,627,300</span><span class="kpi-label">🥧 两地区销</span></div></div>
<div class="grid"><div class="panel"><div id="chart0" class="chart"></div></div><div class="panel"><div id="chart1" class="chart"></div></div><div class="panel"><div id="chart2" class="chart"></div></div><div class="panel"><div id="chart3" class="chart"></div></div></div>
<div class="footer">DB-AGENT &middot; DATA COMMAND CENTER</div>
<script>
echarts.registerTheme('dark', {"color": ["#5470c6", "#fac858", "#ee6666", "#91cc75", "#73c0de", "#3ba272", "#fc8452", "#9a60b4", "#ea7ccc", "#48b8d0"], "backgroundColor": "transparent", "textStyle": {"color": "#e0e6f0"}, "title": {"textStyle": {"color": "#e0e6f0"}}, "legend": {"textStyle": {"color": "#a0a8b8"}}, "tooltip": {"backgroundColor": "rgba(20,24,36,0.95)", "borderColor": "#333", "textStyle": {"color": "#e0e6f0"}}});
var options = ["{\"title\": {\"text\": \"📈 华东 & 华南 月度销售额趋势（近12个月）\", \"left\": \"center\", \"textStyle\": {\"fontSize\": 14}}, \"tooltip\": {\"trigger\": \"axis\"}, \"xAxis\": {\"type\": \"category\", \"data\": [\"2025-07\", \"2025-08\", \"2025-09\", \"2025-10\", \"2025-11\", \"2025-12\", \"2026-01\", \"2026-02\", \"2026-03\", \"2026-04\", \"2026-05\", \"2026-06\", \"2026-07\"], \"axisLabel\": {\"rotate\": 30}}, \"yAxis\": {\"type\": \"value\"}, \"grid\": {\"left\": \"3%\", \"right\": \"4%\", \"bottom\": \"3%\", \"containLabel\": true}, \"series\": [{\"type\": \"line\", \"data\": [116700, 284900, 182700, 522500, 177400, 301900, 76600, 107900, 319100, 219500, 132100, 323000, 292400], \"smooth\": true, \"symbol\": \"circle\", \"symbolSize\": 6, \"areaStyle\": {\"color\": {\"type\": \"linear\", \"x\": 0, \"y\": 0, \"x2\": 0, \"y2\": 1, \"colorStops\": [{\"offset\": 0, \"color\": \"rgba(84,112,198,0.25)\"}, {\"offset\": 1, \"color\": \"rgba(84,112,198,0.02)\"}]}}}]}", "{\"title\": {\"text\": \"📈 华南 月度销售额趋势（近12个月）\", \"left\": \"center\", \"textStyle\": {\"fontSize\": 14}}, \"tooltip\": {\"trigger\": \"axis\"}, \"xAxis\": {\"type\": \"category\", \"data\": [\"2025-07\", \"2025-08\", \"2025-09\", \"2025-10\", \"2025-11\", \"2025-12\", \"2026-01\", \"2026-02\", \"2026-03\", \"2026-04\", \"2026-05\", \"2026-06\", \"2026-07\"], \"axisLabel\": {\"rotate\": 30}}, \"yAxis\": {\"type\": \"value\"}, \"grid\": {\"left\": \"3%\", \"right\": \"4%\", \"bottom\": \"3%\", \"containLabel\": true}, \"series\": [{\"type\": \"line\", \"data\": [153600, 277300, 150300, 104800, 149100, 364100, 420700, 187200, 310300, 174000, 191700, 914100, 173400], \"smooth\": true, \"symbol\": \"circle\", \"symbolSize\": 6, \"areaStyle\": {\"color\": {\"type\": \"linear\", \"x\": 0, \"y\": 0, \"x2\": 0, \"y2\": 1, \"colorStops\": [{\"offset\": 0, \"color\": \"rgba(84,112,198,0.25)\"}, {\"offset\": 1, \"color\": \"rgba(84,112,198,0.02)\"}]}}}]}", "{\"title\": {\"text\": \"📊 两地区总销售额对比（近12个月）\", \"left\": \"center\", \"textStyle\": {\"fontSize\": 14}}, \"tooltip\": {\"trigger\": \"axis\", \"axisPointer\": {\"type\": \"shadow\"}}, \"xAxis\": {\"type\": \"category\", \"data\": [\"华东\", \"华南\"], \"axisLabel\": {\"rotate\": 0}}, \"yAxis\": {\"type\": \"value\"}, \"grid\": {\"left\": \"3%\", \"right\": \"4%\", \"bottom\": \"3%\", \"containLabel\": true}, \"series\": [{\"type\": \"bar\", \"data\": [3056700, 3570600], \"barWidth\": \"60%\", \"itemStyle\": {\"borderRadius\": [4, 4, 0, 0], \"color\": {\"type\": \"linear\", \"x\": 0, \"y\": 0, \"x2\": 0, \"y2\": 1, \"colorStops\": [{\"offset\": 0, \"color\": \"#5470c6\"}, {\"offset\": 1, \"color\": \"#3b5bb5\"}]}}}]}", "{\"title\": {\"text\": \"🥧 两地区销售额占比\", \"left\": \"center\", \"textStyle\": {\"fontSize\": 14}}, \"tooltip\": {\"trigger\": \"item\", \"formatter\": \"{b}: {c} ({d}%)\"}, \"legend\": {\"bottom\": 0, \"textStyle\": {\"fontSize\": 10}}, \"series\": [{\"type\": \"pie\", \"radius\": [\"40%\", \"70%\"], \"center\": [\"50%\", \"50%\"], \"itemStyle\": {\"borderRadius\": 6, \"borderColor\": \"rgba(20,24,36,1)\", \"borderWidth\": 2}, \"label\": {\"show\": false}, \"emphasis\": {\"label\": {\"show\": true, \"fontSize\": 14, \"fontWeight\": \"bold\"}}, \"data\": [{\"name\": \"华东\", \"value\": 3056700}, {\"name\": \"华南\", \"value\": 3570600}]}]}"];
var charts = [];
window.addEventListener('resize', function() { charts.forEach(function(c) { c.resize(); }); });
options.forEach(function(opt, i) {
  var dom = document.getElementById('chart' + i);
  if (!dom) return;
  var c = echarts.init(dom, 'dark');
  c.setOption(JSON.parse(opt));
  charts.push(c);
});
</script>
</body>
</html>
