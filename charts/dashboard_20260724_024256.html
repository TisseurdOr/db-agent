<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本月 vs 上月 订单量对比</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "PingFang SC","Microsoft YaHei",sans-serif;
  background: linear-gradient(135deg, #0a0e1a 0%, #101830 50%, #0d1124 100%);
  color: #e0e6f0; min-height:100vh; overflow-x:hidden;
}
.header { text-align:center; padding:24px 0 8px; }
.header h1 {
  font-size:28px; font-weight:600; letter-spacing:4px;
  background: linear-gradient(90deg, #5470c6, #91cc75, #fac858);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.header .sub { font-size:13px; color:#556; margin-top:6px; letter-spacing:2px; }
.header::after {
  content:''; display:block; width:60%; height:1px;
  background: linear-gradient(90deg, transparent, #334, transparent); margin:16px auto 0;
}
.kpi-row { display:flex; justify-content:center; gap:16px; padding:12px 24px; flex-wrap:wrap; }
.kpi-card {
  background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
  border-radius:8px; padding:12px 24px; text-align:center; min-width:100px;
}
.kpi-value { display:block; font-size:22px; font-weight:700; color:#91cc75; }
.kpi-label { display:block; font-size:11px; color:#667; margin-top:4px; }
.grid { display:grid; grid-template-columns:1fr; gap:16px; padding:12px 24px 24px; max-width:1400px; margin:0 auto; }
.panel {
  background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06);
  border-radius:10px; padding:12px; min-height:300px; transition: border-color 0.3s;
}
.panel:hover { border-color: rgba(84,112,198,0.4); }
.chart { width:100%; height:320px; }
.footer { text-align:center; padding:8px; color:#334; font-size:11px; letter-spacing:2px; }
@media (max-width:900px) { .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="header">
  <h1>本月 vs 上月 订单量对比</h1>
  <div class="sub">REAL-TIME ANALYTICS DASHBOARD</div>
</div>
<div class="kpi-row"><div class="kpi-card"><span class="kpi-value">52</span><span class="kpi-label">本月 vs </span></div></div>
<div class="grid"><div class="panel"><div id="chart0" class="chart"></div></div></div>
<div class="footer">DB-AGENT &middot; DATA COMMAND CENTER</div>
<script>
echarts.registerTheme('dark', {"color": ["#5470c6", "#fac858", "#ee6666", "#91cc75", "#73c0de", "#3ba272", "#fc8452", "#9a60b4", "#ea7ccc", "#48b8d0"], "backgroundColor": "transparent", "textStyle": {"color": "#e0e6f0"}, "title": {"textStyle": {"color": "#e0e6f0"}}, "legend": {"textStyle": {"color": "#a0a8b8"}}, "tooltip": {"backgroundColor": "rgba(20,24,36,0.95)", "borderColor": "#333", "textStyle": {"color": "#e0e6f0"}}});
var options = ["{\"title\": {\"text\": \"本月 vs 上月 订单量对比\", \"left\": \"center\", \"textStyle\": {\"fontSize\": 14}}, \"tooltip\": {\"trigger\": \"axis\", \"axisPointer\": {\"type\": \"shadow\"}}, \"xAxis\": {\"type\": \"category\", \"data\": [\"2026年6月（上月）\", \"2026年7月（本月）\"], \"axisLabel\": {\"rotate\": 0}}, \"yAxis\": {\"type\": \"value\"}, \"grid\": {\"left\": \"3%\", \"right\": \"4%\", \"bottom\": \"3%\", \"containLabel\": true}, \"series\": [{\"type\": \"bar\", \"data\": [34, 18], \"barWidth\": \"60%\", \"itemStyle\": {\"borderRadius\": [4, 4, 0, 0], \"color\": {\"type\": \"linear\", \"x\": 0, \"y\": 0, \"x2\": 0, \"y2\": 1, \"colorStops\": [{\"offset\": 0, \"color\": \"#5470c6\"}, {\"offset\": 1, \"color\": \"#3b5bb5\"}]}}}]}"];
var charts = [];
window.addEventListener('resize', function() { charts.forEach(function(c) { c.resize(); }); });
options.forEach(function(opt, i) {
  var dom = document.getElementById('chart' + i);
  if (!dom) return;
  var c = echarts.init(dom, 'dark');
  c.setOption(JSON.parse(opt));
  charts.push(c);
});
</script>
</body>
</html>
