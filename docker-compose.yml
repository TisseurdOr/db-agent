services:
  db-agent:
    build: .
    image: db-agent:latest
    stdin_open: true    # CLI 交互模式
    tty: true
    env_file:
      - .env
    environment:
      - AGENT_USER=${AGENT_USER:-viewer}
    volumes:
      # 持久化数据（SQLite + ChromaDB）
      - ./db:/app/db
      - ./harness/memory/chroma_db:/app/harness/memory/chroma_db
      # 可选：挂载源码目录用于开发热更新
      # - .:/app
    command: ["--mode", "multi", "--user", "${AGENT_USER:-viewer}"]
